name: Publish

# NOTE (mristin):
# We package the game for Linux, Windows and macOS when a release is published,
# and attach the packages to the release.
#
# You can also start the workflow by hand. Without a tag, it only tries out the
# packaging and uploads the packages as the artifacts of the workflow run. With
# the tag of an existing release, it also attaches the packages to that release,
# e.g., to a release which was published before this workflow existed. Note that
# the packages are then built from the branch the workflow runs on, not from the
# tag.
#
# The packaging itself is dev/package.py (see CONTRIBUTING.md, "Packaging"); we
# use only the GitHub's own actions and the preinstalled gh command-line tool.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to attach the packages to (leave empty to only try out the packaging)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6.2

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # NOTE (mristin):
          # The ONNX models, the 3D models and the pictures are in LFS.
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Godot and its export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64-with-templates

      - name: Download Godot and its export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl --fail --location --silent --show-error --output godot.zip \
            "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "${{ runner.temp }}/godot"
          rm godot.zip

          # NOTE (mristin):
          # The .tpz is a zip archive with all the templates in templates/.
          curl --fail --location --silent --show-error --output templates.tpz \
            "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz -d "${{ runner.temp }}/godot"
          rm templates.tpz

      - name: Install Godot and its export templates
        run: |
          echo "GODOT=${{ runner.temp }}/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$templates_dir"
          cp -r "${{ runner.temp }}/godot/templates/." "$templates_dir/"

      - name: Determine the version and the release
        # NOTE (mristin):
        # Do not call the variable VERSION! MSBuild picks up the environment
        # variables as properties (case-insensitively), so VERSION would override
        # the project version, and dotnet restore fails on tags such as v1.0.0
        # that are not valid NuGet versions.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${INPUT_TAG}"
          fi

          if [ -n "${tag}" ]; then
            # NOTE (mristin):
            # The tags are v1.0.0 etc., the packages auslender-1.0.0-*.zip.
            echo "PACKAGE_VERSION=${tag#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Restore and import
        run: |
          dotnet restore Auslender.sln
          "$GODOT" --headless --path . --import

      - name: Export
        # NOTE (mristin):
        # The script adds the licenses and, on Windows, the camera extension,
        # and fails if Godot reported an error or a package misses ONNX Runtime.
        run: |
          python dev/package.py
          ls -R build | head -100

      - name: Package
        run: |
          mkdir -p dist
          (cd build/linux && zip -q -r "../../dist/auslender-${PACKAGE_VERSION}-linux-x86_64.zip" .)
          (cd build/windows && zip -q -r "../../dist/auslender-${PACKAGE_VERSION}-windows-x86_64.zip" .)

          # NOTE (mristin):
          # Godot packs the macOS app as a zip already, and the script added
          # the licenses next to the app. The app is universal.
          cp build/macos/auslender.zip "dist/auslender-${PACKAGE_VERSION}-macos-universal.zip"

          ls -l dist

      - name: Upload the packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auslender-${{ env.PACKAGE_VERSION }}
          path: dist/*

      - name: Attach the packages to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${{ github.repository }}"
